name: Vyapari CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Don't burn runner minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 0: Database Migrations against a real pgvector instance
  #
  # This job did not exist before, which is how a V5 -> V6 ordering bug that
  # aborted every sequential migration run shipped unnoticed: no job ever
  # executed a line of SQL in db/. It now proves V1..Vn apply cleanly in order,
  # are idempotent, and that a legacy init.sql database can be upgraded.
  # ----------------------------------------------------------------------------
  test-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest

    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vyapari
          POSTGRES_USER: vyapari_admin
          POSTGRES_PASSWORD: vyapari_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyapari_admin -d vyapari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vyapari_admin:vyapari_secure_password@localhost:5432/vyapari
      LEGACY_DATABASE_URL: postgresql://vyapari_admin:vyapari_secure_password@localhost:5432/vyapari_legacy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg==0.30.0

      - name: Migrations apply in order on an empty database
        run: |
          python scripts/migrate.py apply
          echo "--- runner must now report a clean schema ---"
          python scripts/migrate.py apply

      - name: Migration files are named correctly and none are duplicated
        run: python scripts/migrate.py status

      - name: Legacy init.sql database upgrades cleanly
        run: |
          # Simulate the deployment that predates the runner: provisioned from
          # init.sql, no schema_migrations table. Must baseline and then apply.
          PGPASSWORD=vyapari_secure_password psql -h localhost -U vyapari_admin \
            -d postgres -c "CREATE DATABASE vyapari_legacy;"
          PGPASSWORD=vyapari_secure_password psql -q -h localhost -U vyapari_admin \
            -d vyapari_legacy -f db/init.sql
          DATABASE_URL="$LEGACY_DATABASE_URL" python scripts/migrate.py baseline --upto V1
          DATABASE_URL="$LEGACY_DATABASE_URL" python scripts/migrate.py apply

      - name: V7 seller-page objects exist and constraints hold
        run: |
          set -euo pipefail
          q() { PGPASSWORD=vyapari_secure_password psql -qtA -h localhost -U vyapari_admin -d vyapari -c "$1"; }

          for t in seller_pages seller_media seller_highlights seller_highlight_items \
                   seller_page_blocks seller_subscriptions seller_page_follows; do
            test "$(q "SELECT count(*) FROM pg_tables WHERE tablename='$t'")" = "1" \
              || { echo "MISSING TABLE: $t"; exit 1; }
          done

          # seller_pages must reference seller_media (circular FK added in V7)
          test "$(q "SELECT count(*) FROM pg_constraint WHERE conname IN ('fk_seller_page_avatar','fk_seller_page_cover')")" = "2" \
            || { echo "MISSING avatar/cover FKs"; exit 1; }

          # updated_at triggers must exist
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname LIKE 'trg_seller%'")" = "5" \
            || { echo "MISSING updated_at triggers"; exit 1; }

          # least-privilege role from V5/V6 must exist with its grants
          test "$(q "SELECT count(*) FROM pg_roles WHERE rolname='vyapari_agent'")" = "1" \
            || { echo "MISSING vyapari_agent role"; exit 1; }

          echo "All V7 schema assertions passed."

      - name: V8 objects exist and the variant stock invariant holds
        run: |
          set -euo pipefail
          q() { PGPASSWORD=vyapari_secure_password psql -qtA -h localhost -U vyapari_admin -d vyapari -c "$1"; }

          for t in product_variants password_reset_tokens banners leads refunds; do
            test "$(q "SELECT count(*) FROM pg_tables WHERE tablename='$t'")" = "1" \
              || { echo "MISSING TABLE: $t"; exit 1; }
          done

          # Additive columns
          for c in "products has_variants" "cart_items variant_id" "order_items variant_id" \
                   "order_items variant_snapshot" "order_items sku_at_purchase" "orders expires_at"; do
            set -- $c
            test "$(q "SELECT count(*) FROM information_schema.columns WHERE table_name='$1' AND column_name='$2'")" = "1" \
              || { echo "MISSING COLUMN: $1.$2"; exit 1; }
          done

          # payments.status must now accept 'refunded' - a completed refund
          # could not otherwise be recorded against its payment at all.
          test "$(q "SELECT count(*) FROM pg_constraint WHERE conname='payments_status_check'")" = "1" \
            || { echo "MISSING payments_status_check"; exit 1; }
          PGPASSWORD=vyapari_secure_password psql -qtA -h localhost -U vyapari_admin -d vyapari \
            -c "INSERT INTO payments (order_id, amount, status) SELECT o.id, 1, 'refunded' FROM orders o LIMIT 1" \
            >/dev/null 2>&1 && true || { echo "payments.status rejects 'refunded'"; exit 1; }

          # The variant stock sync trigger is the load-bearing piece of V8: a
          # product with has_variants=true must report the SUM of its active
          # variants, or the catalogue keeps selling stock that does not exist.
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname='trg_product_variants_stock_sync'")" = "1" \
            || { echo "MISSING variant stock sync trigger"; exit 1; }

          # Partial unique indexes: SKU is nullable, so a plain UNIQUE(sku)
          # would permit only one NULL row per product.
          test "$(q "SELECT count(*) FROM pg_indexes WHERE indexname='uq_product_variants_sku' AND indexdef LIKE '%WHERE sku IS NOT NULL%'")" = "1" \
            || { echo "SKU uniqueness is not partial"; exit 1; }

          # updated_at triggers for the five new/extended tables
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname IN
                    ('trg_product_variants_updated_at','trg_banners_updated_at',
                     'trg_leads_updated_at','trg_refunds_updated_at','trg_orders_updated_at')")" = "5" \
            || { echo "MISSING V8 updated_at triggers"; exit 1; }

          echo "All V8 schema assertions passed."

      - name: V9 cart and order lines are variant-aware, and the guards hold
        run: |
          set -euo pipefail
          q() { PGPASSWORD=vyapari_secure_password psql -qtA -h localhost -U vyapari_admin -d vyapari -c "$1"; }

          # The cart's identity is (cart_id, product_id, variant_id). Without the
          # NULLS NOT DISTINCT clause, PG treats every NULL as distinct, so the
          # same plain product could be added to one bag twice under two NULL
          # variant rows -- the bug V9 exists to fix, reintroduced by the index
          # being built the ordinary way.
          test "$(q "SELECT count(*) FROM pg_index i
                     JOIN pg_class c ON c.oid = i.indexrelid
                    WHERE c.relname = 'uq_cart_items_product_variant'
                      AND i.indnullsnotdistinct")" = "1" \
            || { echo "cart line index is not NULLS NOT DISTINCT"; exit 1; }

          # A bag line naming a variant that belongs to another product is
          # unenforceable with a single-table CHECK: it spans two tables, so it
          # has to be a trigger. Same for a historical order line whose option
          # was later deleted -- the snapshot has to survive that.
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal
                    AND tgname = 'trg_cart_items_variant_ownership'")" = "1" \
            || { echo "MISSING cart variant ownership trigger"; exit 1; }
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal
                    AND tgname = 'trg_order_items_variant_ownership'")" = "1" \
            || { echo "MISSING order-line variant ownership trigger"; exit 1; }

          # Two indistinguishable options in one picker is a support ticket, and
          # no caller may create one -- not an API, not an import script.
          test "$(q "SELECT count(*) FROM pg_indexes WHERE indexname='uq_product_variants_attributes'")" = "1" \
            || { echo "MISSING variant attribute uniqueness"; exit 1; }
          test "$(q "SELECT indexdef FROM pg_indexes WHERE indexname='uq_product_variants_attributes'")" \
            = "CREATE UNIQUE INDEX uq_product_variants_attributes ON public.product_variants USING btree (product_id, attributes)" \
            || { echo "variant attribute uniqueness is not scoped per product"; exit 1; }

          # An authored stock_qty on a variant product is ignored by the trigger,
          # so a hand-written number silently loses. The guard warns rather than
          # raising, on purpose: a listing import writes products and variants in
          # one pass and must not be turned into an outage by it. Asserted by
          # behaviour, because the catalogue has no column for a trigger's level
          # -- tgtype records timing and row-vs-statement, not WARNING-vs-ERROR.
          test "$(q "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal
                    AND tgname = 'trg_products_variant_stock_authored'")" = "1" \
            || { echo "MISSING authored-stock warning trigger"; exit 1; }

          # Builds its own rows: this database has schema but no data.
          PGPASSWORD=vyapari_secure_password psql -qtA -h localhost -U vyapari_admin \
            -d vyapari >/dev/null 2>authored_warn.txt <<'SQL' \
            || { echo "authored-stock guard RAISED; a listing import would fail"; exit 1; }
            DO $$
            DECLARE p uuid; u uuid; c uuid;
            BEGIN
              SELECT id INTO u FROM users LIMIT 1;
              IF u IS NULL THEN
                INSERT INTO users (name, email, password_hash, role)
                VALUES ('Probe', 'probe@example.com', 'x', 'seller') RETURNING id INTO u;
              END IF;
              SELECT id INTO c FROM categories LIMIT 1;
              IF c IS NULL THEN
                INSERT INTO categories (name, slug) VALUES ('Probe', 'probe') RETURNING id INTO c;
              END IF;
              INSERT INTO products (seller_id, category_id, title, slug, description, price, stock_qty, has_variants)
              VALUES (u, c, 'Guard Probe', 'guard-probe', 'd', 100, 5, TRUE);
              SELECT id INTO p FROM products WHERE slug = 'guard-probe';
              -- The line that must warn rather than abort.
              UPDATE products SET stock_qty = 4242 WHERE id = p;
              UPDATE products SET has_variants = FALSE WHERE id = p;
              DELETE FROM products WHERE id = p;
            END $$;
          SQL
          grep -q "has variants" authored_warn.txt \
            || { echo "authored-stock guard did not warn; the edit is silently lost"; exit 1; }
          rm -f authored_warn.txt

          # Order lines must be able to say what was bought, after the seller
          # renames or retires the option.
          for c in "order_items variant_snapshot" "order_items sku_at_purchase"; do
            set -- $c
            test "$(q "SELECT count(*) FROM information_schema.columns
                       WHERE table_name='$1' AND column_name='$2'")" = "1" \
              || { echo "MISSING COLUMN: $1.$2"; exit 1; }
          done

          echo "All V9 schema assertions passed."

      # The behavioural side of V8 — that the stock-sync trigger actually
      # maintains products.stock_qty as the sum of active variants — is covered
      # by tests/test_variants.py, which runs in the test-backend-core job
      # below alongside the rest of the suite against the same pgvector
      # service. It is not repeated here: this job runs from the repository
      # root, where the backend-core-py `tests` package is not importable.

  # ----------------------------------------------------------------------------
  # Job 1: Backend Core Test Suite (FastAPI + P0 Guarantees)
  #
  # Now backed by a real pgvector instance. Previously this job had no database
  # whatsoever, so every test was mock-based and no SQL was ever executed. The
  # seller-page suite (tests/test_seller_pages.py) skips itself when
  # TEST_DATABASE_URL is absent, so setting it here is what turns it on.
  # ----------------------------------------------------------------------------
  test-backend-core:
    name: Backend Core Tests
    runs-on: ubuntu-latest

    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vyapari_test
          POSTGRES_USER: vyapari_admin
          POSTGRES_PASSWORD: vyapari_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vyapari_admin -d vyapari_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://vyapari_admin:vyapari_secure_password@localhost:5432/vyapari_test
      DATABASE_URL: postgresql://vyapari_admin:vyapari_secure_password@localhost:5432/vyapari_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend-core-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Provision the test schema from db/migrations
        run: |
          python -m pip install asyncpg==0.30.0
          python scripts/migrate.py apply

      - name: Run Unit, P0 and database integration tests
        working-directory: ./backend-core-py
        run: python -m unittest discover -s tests -p "test_*.py"

  # ----------------------------------------------------------------------------
  # Job 2: AI Microservices Tests (Seller Agent & Recommendation)
  # ----------------------------------------------------------------------------
  test-ai-services:
    name: AI Microservices Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Test Seller Agent Service
        working-directory: ./service-seller-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_*.py"

      - name: Test Recommendation Service
        working-directory: ./service-recommendation
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_*.py"

  # ----------------------------------------------------------------------------
  # Job 3: Frontend Build & Type Validation (React 18 + Vite SPA)
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production SPA Bundle
        working-directory: ./frontend
        run: npm run build

      # Section J2. Asserts the bytes a first-time visitor must download, the
      # largest chunk a navigation can cost, and that the route tree is still
      # split -- reading Vite's manifest so it measures the entry's real static
      # closure rather than every file in dist. A budget that nobody enforces is
      # a comment.
      - name: Bundle budget
        working-directory: ./frontend
        run: npm run budget

      # Renders components to a string and asserts on the markup. Catches
      # render-time failures a successful bundle cannot, with no browser, no
      # backend and no database.
      - name: Component render smoke tests
        working-directory: ./frontend
        run: npm run smoke
